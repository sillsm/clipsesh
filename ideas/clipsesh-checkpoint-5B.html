<details class="shell" ${standalone?'open':''}><summary>Clip Sesh · Roland firmware lab · Checkpoint 5</summary><div class="body">
<header><div><div class="eyebrow">CLIP SESH / NATIVE RUNTIME / CP 05</div><h1>Faster firmware. Live audio preview.</h1><p>Import a sample with the instrument’s own software.<br>A faster execution core, buffered renders, and a live audio bus.</p></div><span class="badge">EXPERIMENTAL · WASM + LIVE PCM</span></header>
<div class="topnote">This is the firmware workbench, not yet the engine switch inside our main sampler. <span class="offline">Everything runs locally.</span> Your firmware is never included or uploaded.</div>
<div class="toolbar"><button class="primary" data-action="choose">Load Roland 5.52 ZIP</button><button data-action="run" disabled>Boot / reset</button><button data-action="pause" disabled>Pause</button><button data-action="forget" disabled>Stop &amp; forget</button><input data-part="file" type="file" accept=".zip,application/zip" hidden></div>
