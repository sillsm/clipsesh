<!-- pc:block 847-heading -->
## 1. BWV 847 — two hands moving together

<!-- pc:block 847-context -->
The C-minor Prelude belongs to the first book of *The Well-Tempered Clavier*. The Netherlands Bach Society describes its restless broken-chord writing and draws attention to both hands moving together. That is the useful starting point here: not a tune with a quiet accompaniment, but two active lines whose repeated subdivisions give the harmony momentum. The collection's systematic traversal of keys supplies the larger context; our local question is how this particular C-minor texture changes while its surface keeps running. [Context and performance: Netherlands Bach Society](https://www.bachvereniging.nl/en/bwv/bwv-847).

<!-- pc:block 847-patterns-heading -->
### The patterns: the same pulse is not the same contour

<!-- pc:block 847-open-pattern -->
In the opening right hand, the unique pitches are `[C4, D4, E♭4, C5]`. Pattern A plays `[4, 3, 2, 3, 1, 3, 2, 3]` twice: high C, E♭, neighboring D, E♭, low C, E♭, D, E♭. The left hand starts with `[C3, E♭3, F3, G3]`. Pattern B plays `[1, 4, 3, 4, 2, 4, 3, 4]` twice. One hand starts high; the other starts low. Both repeatedly lean away from, and return to, a stable tone.

<!-- pc:block 847-m4 -->
In measure 3 the left-hand set is `[C3, F3, G3, A♭3]`, still with B. In measure 4 it becomes `[C3, D3, E♭3, G3]`, and the order is `[1, 3, 2, 3, 4, 3, 2, 3]`: **C**. The fifth attack has become the highest pitch instead of an inner pitch, while the repeated tone moves from the top rank to an inner rank. “The chord changed” does not explain away that change. [Hear the left hand, measures 3–4](#listen-bwv847-3-4-left).

<!-- pc:block 847-five -->
A and B carry the opening; C is a substantial recurring alternative, not an exception invented for one bar. D changes the right-hand relationship between its two accented pitches in measures 14, 23 and 24. E is the one-bar left-hand variant in measure 18: C becomes B♭ at the second half of the bar. This B♭ is present in the acquired source and explicitly discussed in its typesetting source. The audit below groups the actual output, including cases where two separately named clips become identical after an edit. [Reference score](https://www.mutopiaproject.org/ftp/BachJS/BWV847/bwv847a/bwv847a-a4.pdf) · [Typesetter's source](https://www.mutopiaproject.org/ftp/BachJS/BWV847/bwv847a/bwv847a.ly).

<!-- pc:block 847-harmony-heading -->
### The harmony: a bass descent with changing destinations

<!-- pc:block 847-harmony-method -->
The following is our harmonic reading of the reference, not a claim that a pitch-set classifier can discover a unique analysis. The chord view is a declared reduction: it selects attacks and holds them together. The omitted attacks still matter. In the opening, treating D and F as additions to a giant C-minor chord misses how each neighbor moves back into a chord tone. Hear the chord reduction, then hear those little departures restored.

<!-- pc:block 847-open-harmony -->
Measures 1–5 establish C, darken it, and return to it. `Cm → Fm/C → Bdim7/C → Cm → A♭/C` keeps a C bass while the upper notes change. F minor is the subdominant color. B–D–F–A♭ is the leading-note diminished seventh, here over the retained C. Its attraction comes from the notes' directions—especially B toward C—not merely from its symmetric stack of minor thirds. The return to Cm in measure 4 is made more distinct by the left-hand switch to C. A♭/C then keeps C and E♭ while changing the upper color. [Hear measures 1–5 as chords](#listen-bwv847-1-5-chords).

<!-- pc:block 847-descending-table -->
| Measures | Useful chord names | What moves |
|---|---|---|
| 6 → 7 | D7/C → Gm/B♭ | A dominant leading to G minor; bass C descends to B♭. |
| 8 → 9 | C7/B♭ → Fm/A♭ | The same dominant-to-minor relationship a step lower; bass B♭ descends to A♭. |
| 10 → 11 | B♭7/A♭ → E♭/G | Another dominant-to-target pair, now reaching the relative-major harmony; bass A♭ descends to G. |

<!-- pc:block 847-descending-text -->
This is an especially compact musical idea. The dominant chord's seventh is in the bass; it falls by step into the third of the next chord. In C-minor language, D7 points to v, C7 points to iv, and B♭7 points to III. Those are local tonicizations, not three instantaneous declarations that the whole piece has permanently changed key. F♯ in D7 and E natural in C7 are purposeful changes in tendency. The bass falls `C–B♭–A♭–G`, but the upper notes explain what each step means. [Hear the bass, measures 6–11](#listen-bwv847-6-11-bass), then [hear the chords](#listen-bwv847-6-11-chords).

<!-- pc:block 847-middle-harmony -->
Measures 12–14 answer the descent with a rise in the bass, C–D–E♭. A♭maj7/C and B♭7/D direct us toward E♭. The G that remains in the A♭ harmony is worth hearing rather than deleting from the label. Measure 14 also retains A♭ in the moving lower line; an exact collected-pitch description may therefore say E♭add11, while the broader destination is E♭. These are different statements: one describes a selected collection, the other the phrase's direction. Neither requires every attack in a bar to have equal harmonic status.

<!-- pc:block 847-late-harmony -->
The F7/E♭ of measure 15 leads into more chromatic writing. The B–D–F–A♭ diminished collection returns with D and then C beneath it in measures 16–17. In measure 18 the bass changes inside the measure, C to B♭; the upper E♭–C–B–C–G figure remains. Hearing only one held bass per bar would erase that event. Our bass projection therefore retains both anchors. In the next passage A♭ rises chromatically to A and falls to G; the F♯-diminished collection in measure 20 acquires direction from that approach to G.

<!-- pc:block 847-pedal -->
Measures 21–24 hold G underneath changing upper material. That G is the dominant bass of the opening C minor, but the upper C, E♭, F, F♯ and A♭ prevent four bars of uncomplicated “G7.” Some notes behave like suspensions, others like neighbors or a leading-note diminished sonority over the pedal. A label such as F♯dim7/G is useful because it preserves the pedal and the upper chord separately. A long suspended-chord label is an exact collection, not an instruction to hear every note as a settled jazz extension. The unresolved character is appropriate: our excerpt stops before the prelude changes its manner of writing. [Hear measures 19–24](#listen-bwv847-19-24-full).

<!-- pc:block 847-melody-heading -->
### The melody: an upper outline, an inner line, and a moving bass

<!-- pc:block 847-melody-first -->
There is no need to declare one privileged “hidden melody.” We can test several projections. The right hand's first attack in measures 1–5 gives C–A♭–B–C–E♭. That hears the opening expansion and the leading note's pull. But it discards the E♭–D–E♭ and similar neighbor motions that make the surface active. The highest-note projection captures one contour; the whole right-hand projection captures how Bach inhabits it.

<!-- pc:block 847-melody-descent -->
From measures 6–14, the first high notes form `D–D–C–C–B♭–B♭–A♭–A♭–G`. The repeated notes cross the boundaries of the harmonic pairs. D is heard over D7/C and then Gm/B♭; C over C7/B♭ and then Fm/A♭; B♭ over B♭7/A♭ and then E♭/G. Thus the top can stay put while the bass resolves. It is not simply a sequence of chords changing under an unrelated tune: common upper notes help join one harmonic event to the next. [Hear the upper peaks with bass](#listen-bwv847-6-14-top).

<!-- pc:block 847-melody-inner -->
Listen also to the fifth sixteenth of each half-bar. It is C below the opening high C, then C below A♭, then D below B, then E♭ below C. These alternating anchors create more than one line within the right hand. The frequent returning pitch connects them with its neighbor. On the piano roll this is visible as two different kinds of movement: a change to the repeatedly visited inner row, and a change to the more exposed attacks. Keeping only notes above a fixed pitch is therefore a useful experiment, but it will drop a line when that line passes below the threshold.

<!-- pc:block 847-melody-turn -->
Measure 19 is a particularly good counterexample to “melody equals the highest note.” The right hand begins on a low F and reaches the higher F later in the cell. Its highest pitch alone does not reveal that reversal of emphasis. This is the same C contour now used by both hands: `RC LC`. Measure 20 continues that rearranged right-hand shape with F♯ and E♭. Compare [the beat-head extraction](#listen-bwv847-19-20-melody) with [both original hands](#listen-bwv847-19-20-full). Register, attack position and bass direction do work that a list of maximum pitches cannot explain.

<!-- pc:block 847-experiment -->
A useful variation is to keep the rank patterns and replace one measure's pitch set on the piano. A second is to keep its pitches and assign another compatible pattern. Those are different experiments: the first changes pitch relationships without changing the rank contour; the second changes contour without changing available pitches. Make a local copy before altering a shared clip when the experiment is meant for one hand in one measure.

<!-- pc:block 847-compression-heading -->
### Compression: what the repeated idea buys us

<!-- pc:block 847-compression-text -->
The reference excerpt contains **768 note events**. The canonical program uses **193 pitch arguments** in 48 hand applications. Its five patterns store only **48 step selections**: four repeated eight-note seeds and one sixteen-note variant. That is about **3.98 events per pitch argument** and **16 events per stored selection**. These are different sources of reuse, not ratios to multiply together.

<!-- pc:block 847-compression-bytes -->
For a reproducible whole-representation comparison, encode every expanded note as `[onset, duration, pitch, hand]`. That event table occupies **9,765 UTF-8 bytes**. The minified function program, five pattern definitions, meter and timebase occupy **2,491 bytes**, or **3.92× smaller**. Both numbers omit the article, MIDI reference, revision history and interface. The program includes its playback wrapper, which the event table does not need for this comparison. This is not a claim that the HTML file is smaller than a MIDI file.

<!-- pc:block 847-compression-idea -->
The musical idea is more compact than either serialization: two simultaneous neighbor-note figures, recurring contour alternatives, a descending bass linked to dominant resolutions, and an upper line held across those resolutions. Our present program captures the first two very directly. It still lists many pitch choices rather than generating the whole harmonic sequence from a higher-order rule. That is an honest boundary of the compression. A later `sequence(dominantToMinor, ...)` should count its voicing choices and chromatic exceptions instead of pretending they came for free.

<!-- pc:block 999-patterns-heading -->
### The patterns: upper motion and lower interjections

<!-- pc:block 999-patterns-main -->
BWV 847 put the hands on the same sixteenth-note attacks. BWV 999 leaves spaces. The upper figure begins after the bass, rises through three tones, and repeatedly returns to its lowest tone. Near the end of the bar, two lower notes occupy gaps in that upper figure. The result can sound like a continuous stream, but its division into voices is different. A held-bass projection is therefore a reduction we make for listening; it is not the bass duration in the reference.

<!-- pc:block 999-patterns-five -->
RH pattern A covers 40 measures. RH E covers measure 34, where the returning middle tone differs from the rising one. The common lower pattern B plays the lowest pitch, then the highest, then the middle. C, in measures 7 and 14, returns to the same pitch as its opening bass. D, in measure 16, starts and repeats on its higher pitch before descending. Those equalities are now visible: the lower inputs are unique pitches, not duplicate roles that conceal a repeated note. The five-template total is therefore not “five different rhythms.” It includes differences in rank and repeated-pitch identity.

<!-- pc:block 999-harmony-heading -->
### The harmony: C minor, the G-minor region, and two long pedals

<!-- pc:block 999-early -->
The first six bars pair their harmonic changes: two bars of Cm, two of Fm/C, and two of Bdim7/C. C remains underneath. As in BWV 847, a stable bass lets changing upper notes create activity without requiring a new bass root every bar. The leading-note diminished chord is especially tense over C because B's attraction to C and A♭'s downward tendency remain audible against the held tonal reference.

<!-- pc:block 999-descent -->
Measures 7–10 make the bass move while the upper C-minor voicing stays fixed: C–B♭–A♭–G under G–C–E♭. The resulting descriptions are Cm, Cm7/B♭, A♭maj7 and Cm/G. An arranger might write Cm/B♭ for the second bar because the same upper triad remains; a complete collected-pitch name includes the seventh. Either way, a new chord symbol need not mean a new upper-hand idea. This is bass movement turning the same voicing into different harmonies. [Hear measures 7–10 as bass](#listen-bwv999-7-10-bass), then [as chords](#listen-bwv999-7-10-chords).

<!-- pc:block 999-approach-g -->
F♯ in the next bass is a directional event. Measures 11–12 lead through a diminished collection and D7(b9)/F♯ toward G minor in measures 13–14. D is the dominant of G, and F♯ is its leading note. The A retained in the upper figure of measure 13 is a ninth above G; it then gives way to the simpler G-minor collection in measure 14. This passage gives G minor enough local emphasis to be heard as a region, rather than treating every F♯ as an isolated alteration of C minor. E♭maj7 and Cm6 in measures 15–16 continue the movement toward the next D bass.

<!-- pc:block 999-d-pedal -->
From measures 17–32, the initial bass remains **D**. That long dominant pedal lets the upper writing move between G-minor shapes, D-dominant shapes, diminished collections and suspended configurations. Gm/D is not D minor: its B♭ and G are heard against a D bass whose function is established by its surroundings. Likewise D7(b9) makes the upper E♭ intelligible as a particularly close tension against D. The chord view keeps that bass audible so these are not mistaken for unrelated root-position chords.

<!-- pc:block 999-chromatic-pedal -->
The pedal does not mean harmonic stasis. Measures 25 and 28 contain the pitch classes of C♯dim7 above D, differently voiced. Describing both with the same upper-chord name exposes their relationship; calling one B♭dim7 and the other Gdim7 merely because those notes happen to be available roots obscures the directed C♯. D7sus4(b9), D7, and Gm/D offer other kinds of tension and release. Still, a chord reduction pools selected attacks across time. Where a pitch moves or resolves inside the bar, that label must be read alongside the actual roll, not substituted for it. [Hear the D-pedal span](#listen-bwv999-17-32-chords).

<!-- pc:block 999-g-pedal -->
The bass becomes **G** in measure 33 and stays there through the end of our excerpt. The B natural introduced inside measure 34 and the G-major sonority at measure 37 give G a major-third brightness. From the opening C-minor viewpoint, G is also the dominant. These hearings are not mutually exclusive: a prolonged local G focus can remain related to C. G7(b9) and Cm/G in measures 38–39 make that relationship particularly audible. The final two included bars retain a diminished upper fragment over G; the excerpt is not a complete return to a root-position C-minor cadence.

<!-- pc:block 999-m34 -->
Measure 34 deserves more than a “different chord” badge. Its upper notes begin `G–A–C`, then return through **B** rather than A. In rank language the input is `[G3, A3, B3, C4]`, and E selects the appropriate ascending and returning rows. In a G-centered hearing, C to B supplies a fourth-to-third resolution. The A and the timing make “Gsus4 → G” a useful sketch, not a literal statement that every note of the first half is a plain sus4 triad. The explicit pitch set and E pattern preserve the detail. [Hear measure 34's full figure](#listen-bwv999-34-34-full).

<!-- pc:block 999-melody-heading -->
### The melody: an arch above the fixed bass

<!-- pc:block 999-melody-opening -->
The opening top notes G–G–A♭–A♭–F–F already form a line across the repeated bars. Meanwhile the repeatedly revisited lower note of the upper figure and the two lower interjections form other continuities. Calling the highest note “the melody” is convenient, but it suppresses those strands. Measures 7–10 demonstrate the reverse of melodic expansion: the upper voicing stays unchanged while the bass descent does most of the expressive work.

<!-- pc:block 999-melody-arch -->
The long D pedal makes a larger upper contour especially easy to hear. Beginning in measure 19, the peaks rise **G–A–B♭–C**, reaching C in measure 22, then descend **B♭–A–G–G–F♯–E–E♭–D–C–C** through measure 32. The bass has not gone anywhere. The expansion of register, the high point, and the gradually falling upper line supply direction above it. At the peak, C is also the seventh of a D-dominant sonority: melodic height and harmonic tension cooperate. [Hear the peak line against D](#listen-bwv999-19-32-top).

<!-- pc:block 999-melody-voicing -->
A chord chart alone does not specify that arch. The same dominant harmony can place its third, seventh or altered tone at the top; each choice changes the audible line. Conversely, the same highest pitch can continue while inner tones change its meaning. That is why the piano roll takes a voiced pitch set, rather than always interpreting “3” as the third of a chord. Pattern A says how to visit the selected tones. The input says which tones occupy the register that the ear follows.

<!-- pc:block 999-melody-resolution -->
The C-to-B motion of measure 34 is another warning about extraction. The highest note of that bar remains C, so a highest-per-measure reduction misses the important B completely. Listen to the whole upper hand or select the returning slots instead. A useful melodic analysis asks both **which pitch is exposed** and **what it moves to**. A note can be important because it resolves a previous note, not because it is the loudest, longest, highest or first.

<!-- pc:block 999-compression-heading -->
### Compression: fewer notes, but more harmonic parameters

<!-- pc:block 999-compression-text -->
The 41-bar excerpt contains **492 note events**. Its five patterns store **27 event selections**. Repeated complete bars reduce the literal program to **72 hand calls and 214 pitch arguments**, compared with 82 hand applications after expansion. That is about **2.30 events per pitch argument**, and **18.22 events per stored selection**. The short rhythm is reused extensively, but the changing bass, voicings and lower notes still require many pitch parameters.

<!-- pc:block 999-compression-bytes -->
The same byte-counting convention gives **6,287 bytes** for the expanded event table and **3,412 bytes** for the program plus pattern dictionary, or **1.84× smaller**. BWV 847 compresses better by that combined measure even though its surface has more notes. Each eight-note cell in 847 repeats, and each small input set is used many times within the bar. BWV 999 leaves more silence and asks for more distinct lower-voice information per event. “More notes” is not the same as “more independent musical decisions.”

<!-- pc:block 999-compression-idea -->
At the idea level we can say more: hold C while harmony changes; descend the bass under a fixed C-minor voicing; move into the G-minor region; hold D while the upper line arches; then hold G while upper tensions resolve and return. That is a useful description of phrase construction, but it is not yet an executable replacement for all 214 pitch arguments. We should count an exact reconstruction first, then test whether such phrase functions genuinely replace parameters rather than merely rename them.

<!-- pc:block pattern-identity -->
## What counts as the same pattern?

<!-- pc:block pattern-correction -->
The earlier version undercounted the patterns. It gave notes roles and allowed those roles to change their order in pitch. That can make two different contours look like one instruction. **BWV 847's left hand in measure 4 is not the same rank pattern as measure 3.** We should see that difference before deciding whether it matters to our hearing.

<!-- pc:block canonical-definition -->
For this notebook, a pitch set is **unique and ordered from low to high**. A pattern selects ranks from that set and specifies their onset and duration. Rank 1 is the lowest entered pitch, not necessarily the chord root. The rank numbers are not scale degrees. Replacing a three-note input C4–D4–E♭4 with D4–F4–A4 changes the intervals and pitch content, but not a clip's rank selections. Turning a low attack into a high attack does change it.

<!-- pc:block hands-notation -->
A letter has **one definition shared by both hands within a study**. `RA LB` means “the right hand plays A; the left hand plays B.” Measure 4 of BWV 847 is `RA LC`. Measure 19 is `RC LC`: exactly the same contour instruction in both hands, applied to different pitches. Letters are local to the prelude—BWV 999's A is a different clip in a different meter.

<!-- pc:block minimality -->
We expand repetitions, substitute the sorted pitch ranks, and compare every hand-measure as a list of `(onset, duration, rank)`. Two lists share a pattern exactly when those lists are identical. This gives **five distinct patterns for each excerpt**. Five is minimal for this defined representation because five distinct lists cannot be produced by fewer fixed lists. It is not a claim that no more powerful musical language could express them with fewer ideas. Permutations, inversions, conditional notes and nested submotifs could compress further; their instructions and parameters would have to be counted too.

<!-- pc:block distinct-layers -->
Our full instruction is consequently `hands(arp(A, pitches(...)), arp(B, pitches(...)))`. There are three separate choices: the harmony we hear, the pitches and registers we choose to voice it, and the timing and order in which we play them. A chord name is a useful description, but it does not reconstruct every neighbor note or every octave. An explicitly entered `ordered(...)` list is still available in the function editor; it is labeled noncanonical rather than silently used to disguise a contour change.

## Make your own version, and keep it

<!-- pc:block custom-chords -->
Open **Chords**, clear the piano, and tap a custom collection. The inferred name is a best pitch-content description, not a claim that the software knows its musical function. Choose a bass independently to make a slash chord. Auto spelling uses the inferred chord where possible: a third of A is C♯, not D♭. Prefer-flats and prefer-sharps are available when the intended context differs. Symmetric diminished chords and ambiguous added-note collections still need a musical decision; the exact pitches remain visible.

<!-- pc:block chord-apply -->
**Apply chord** constructs new chord-tone inputs for both hands in their current registers. It deliberately replaces the original neighbor-note material; it does not claim to preserve Bach's voice leading. To keep one specific neighbor or choose exact octaves, select **RH pitches** or **LH pitches** and edit that set directly. Moving a roll rectangle changes which input rank is played. Changing a piano key changes the pitch available at that rank. The expression and score update from the same source.

The musical readings above are this notebook's analyses of the supplied scores and independently decoded MIDI. The source for BWV 847 is [Mutopia #550](https://www.mutopiaproject.org/cgibin/piece-info.cgi?id=550), typeset by Davide Castellone, with Breitkopf & Härtel, 1866 identified as the underlying edition and an explicit measure-18 note in the LilyPond source. The source for BWV 999 is [Mutopia #60](https://www.mutopiaproject.org/cgibin/piece-info.cgi?id=60), Jakob Bagterp's D-minor lute/guitar setting; its underlying edition is not identified. Both typesettings are marked Public Domain. The acquired MIDI bytes and their provenance are embedded in each study.
